  <path d="M-40 850 C120 650 160 230 430 310 C650 375 610 710 860 570" fill="none" stroke="#111519" stroke-width="3" opacity=".7"/>
  <path d="M-60 900 C120 700 180 300 450 360 C650 410 590 760 860 630" fill="none" stroke="#ece9e1" stroke-width="2" opacity=".8"/>
  <circle cx="420" cy="475" r="66" fill="#111519" opacity=".78"/><circle cx="420" cy="475" r="33" fill="#d7ff62"/>
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#ece9e1" stroke-opacity=".5"/>
</svg>
