<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Human touch abstract composition</title>
  <desc id="desc">An abstract warm and cool composition with organic shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6d8cb"/><stop offset=".45" stop-color="#8fa6ad"/><stop offset="1" stop-color="#202d42"/></linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f06a42"/><stop offset=".5" stop-color="#d7ff62"/><stop offset="1" stop-color="#3e6fff"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g opacity=".25" stroke="#111519"><path d="M0 120H800M0 240H800M0 360H800M0 480H800M0 600H800M0 720H800M0 840H800"/><path d="M100 0V1000M220 0V1000M340 0V1000M460 0V1000M580 0V1000M700 0V1000"/></g>
